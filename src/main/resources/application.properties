spring.application.name=dimdim-webapp
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# Conexao com o Azure SQL: SOMENTE por variaveis de ambiente (nada de senha no codigo)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# As tabelas sao criadas pelo script scripts/01_ddl_dimdim.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Application Insights: a connection string vem da variavel de ambiente
# APPLICATIONINSIGHTS_CONNECTION_STRING configurada no Web App (agente Java do App Service)
